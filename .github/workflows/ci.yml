name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    uses: getkirby/actions/.github/workflows/php.yml@5a2291a578b5304133b7e3106f3bb92f9385bea0 # 0.1.0
    with:
      # ImageMagick and libvips read HEIC and AVIF through libheif, whose codecs are plugins:
      # libde265 and x265 for HEIC, aom for AVIF (aomdec is a dependency); ubuntu-24.04 ships libvips 8.15
      apt: libvips42t64 libheif-plugin-libde265 libheif-plugin-x265 libheif-plugin-aomenc
      # tests for these drivers and formats fail instead of skipping
      env: DARKROOM_REQUIRE=gd:avif,webp imagick:avif,heic,jp2,webp vips:avif,heic,jp2,jxl,webp
      extensions: exif, ffi, gd, imagick
      phpunit-args: --display-skipped
